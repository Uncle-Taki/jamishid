root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/jamshid-backend ./cmd/api"
bin = "./tmp/jamshid-backend"
include_ext = ["go", "mod", "sum", "json", "sql"]
exclude_dir = ["tmp", "bin", ".git", "vendor", "recovery-artifacts"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "10s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
